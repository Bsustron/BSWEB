<form name="contact" method="POST" action="/contact-thanks/" data-netlify="true" netlify-honeypot="bot-field" class="mt-4">
  <input type="hidden" name="subject" value="New message from %{siteName} contact form" />
  <p class="d-none"><label>Don’t fill this out: <input name="bot-field" /></label></p>
  <div class="mb-3">
    <label for="contact-name" class="form-label">Name</label>
    <input type="text" class="form-control" id="contact-name" name="name" autocomplete="name" required />
  </div>
  <div class="mb-3">
    <label for="contact-email" class="form-label">Email</label>
    <input type="email" class="form-control" id="contact-email" name="email" autocomplete="email" required />
  </div>
  <div class="mb-3">
    <label for="contact-message" class="form-label">Message</label>
    <textarea class="form-control" id="contact-message" name="message" rows="6" required></textarea>
  </div>
  <button type="submit" class="btn btn-primary">Send message</button>
</form>
